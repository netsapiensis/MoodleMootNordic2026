# Moodle over https on port 443, with the stack's self-signed certificate.
# Mounted into /etc/apache2/sites-available/ and enabled by enable-https.sh.
<VirtualHost *:443>
    ServerName localhost
    DocumentRoot ${APACHE_DOCUMENT_ROOT}
    SSLEngine on
    SSLCertificateFile    /certs/node.pem
    SSLCertificateKeyFile /certs/node-key.pem
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
